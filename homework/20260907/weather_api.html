<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>氣象預測36小時</title>
    <style>
        :root {
            color-scheme: dark;
            --ink: #e8f3f7;
            --muted: #a8c0c9;
            --line: rgba(190, 225, 232, 0.14);
            --panel: rgba(10, 31, 43, 0.86);
            --panel-light: rgba(30, 69, 83, 0.72);
            --accent: #f6c85f;
            --accent-strong: #ffe29a;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Microsoft JhengHei", "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 12% 8%, rgba(246, 200, 95, 0.2), transparent 28%),
                linear-gradient(135deg, #0b2835 0%, #123f50 48%, #071820 100%);
            color: var(--ink);
        }

        .container {
            width: min(1180px, 100%);
            padding: 34px clamp(20px, 4vw, 52px) 42px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: 0 28px 70px rgba(2, 13, 18, 0.4);
            text-align: center;
        }

        .back-row {
            text-align: left;
        }

        .back-link {
            display: inline-block;
            padding: 10px 16px;
            background: rgba(232, 243, 247, 0.94);
            color: #123f50;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .back-link:hover {
            background: #ffffff;
            transform: translateY(-2px);
        }

        .page-heading {
            margin: 42px 0 28px;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--accent);
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.16em;
        }

        h1 {
            margin: 0;
            color: #ffffff;
            font-size: clamp(2rem, 5vw, 3.4rem);
            letter-spacing: 0.02em;
            line-height: 1.1;
        }

        .intro {
            max-width: 600px;
            margin: 14px auto 0;
            color: var(--muted);
            line-height: 1.7;
        }

        .table-wrap {
            overflow-x: auto;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: rgba(4, 19, 26, 0.45);
        }

        table {
            width: 100%;
            min-width: 820px;
            border-collapse: collapse;
            text-align: center;
        }

        th,
        td {
            padding: 16px 14px;
            border-bottom: 1px solid var(--line);
        }

        th {
            background: var(--panel-light);
            color: var(--accent-strong);
            font-size: 0.88rem;
            font-weight: 700;
            white-space: nowrap;
        }

        td {
            color: var(--ink);
            font-size: 0.95rem;
        }

        tbody tr:last-child td {
            border-bottom: 0;
        }

        tbody tr {
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background: rgba(90, 178, 194, 0.1);
        }

        td:first-child {
            color: #ffffff;
        }

        td small {
            color: var(--muted);
            font-size: 0.86rem;
        }

        .loading,
        .error {
            padding: 28px;
            color: var(--muted);
        }

        .error {
            color: #ffc7b7;
        }

        @media (max-width: 680px) {
            body {
                padding: 16px 10px;
                align-items: flex-start;
            }

            .container {
                padding: 22px 14px 28px;
            }

            .page-heading {
                margin: 34px 0 22px;
            }

            .intro {
                font-size: 0.92rem;
            }
        }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body>
    <div class="container">
        <div class="back-row">
            <a class="back-link" href="../18_ajax.html">返回前頁</a>
        </div>
        <header class="page-heading">
            <p class="eyebrow">TAIWAN WEATHER SERVICE</p>
            <h1>氣象預測 36 小時</h1>
            <p class="intro">即時整理各縣市未來 36 小時的天氣現象、降雨機率與溫度變化。</p>
        </header>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>縣市名稱</th>
                        <th>時間區段</th>
                        <th>天氣現象 (Wx)</th>
                        <th>降雨機率 (PoP)</th>
                        <th>最低溫度 (MinT)</th>
                        <th>最高溫度 (MaxT)</th>
                    </tr>
                </thead>
                <tbody id="weather-list">
                    <tr>
                        <td class="loading" colspan="6">資料載入中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let url = `https://opendata.cwa.gov.tw/api/v1/rest/datastore/F-C0032-001?Authorization=CWA-9047051C-A45F-4875-84DF-9C5A1AC91455`;
        $.ajax({
            type: "get",
            url: url,
            data: {},
            dataType: "json",
            success: function (response) {
                // 1. 取得所有縣市的陣列
                const locations = response.records.location;

                // 2. 準備一個空字串，用來累積所有 HTML 表格列 (tr)
                let tableRows = '';

                // 3. 使用 jQuery 的 $.each 遍歷每一個縣市
                $.each(locations, function (index, loc) {
                    const cityName = loc.locationName; // 縣市名稱 (如：嘉義縣)

                    // 氣象署的 weatherElement 陣列固定順序通常為：0:Wx, 1:PoP, 2:MinT, 3:CI, 4:MaxT
                    // 安全起見，這裡直接抓取對應索引的第一個時間段 [0]
                    const startTime = loc.weatherElement[0].time[0].startTime;
                    const endTime = loc.weatherElement[0].time[0].endTime;

                    const wx = loc.weatherElement[0].time[0].parameter.parameterName; // 天氣現象
                    const pop = loc.weatherElement[1].time[0].parameter.parameterName; // 降雨機率
                    const minT = loc.weatherElement[2].time[0].parameter.parameterName; // 最低溫
                    const maxT = loc.weatherElement[4].time[0].parameter.parameterName; // 最高溫

                    // 將時間格式簡化，只顯示「月/日 時:分」讓表格更美觀
                    const formatTime = `${startTime.substring(5, 16)} ~ ${endTime.substring(5, 16)}`;

                    // 4. 組合這一列的 HTML
                    tableRows += `
            <tr>
                <td><strong>${cityName}</strong></td>
                <td><small>${formatTime}</small></td>
                <td>${wx}</td>
                <td>${pop} %</td>
                <td>${minT} °C</td>
                <td>${maxT} °C</td>
            </tr>
        `;
                });

                // 5. 使用 jQuery 的 .html() 將所有產生的 tr 一次塞入 tbody 中，覆蓋掉「載入中」
                $('#weather-list').html(tableRows);
            },

            error: function (xhr, status, error) {
                console.log('failed: ', error);
                $('#weather-list').html('<tr><td class="error" colspan="6">目前無法取得天氣資料，請稍後再試。</td></tr>');
            }
        });
    </script>
</body>

</html>
